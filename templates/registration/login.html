{% extends "base.html" %}

{% block content %}
<div class="login-shell d-flex justify-content-center align-items-start">
  <div class="col-11 col-sm-8 col-md-5 col-lg-4">
    <div class="card shadow-sm border-0 w-100">
      <div class="card-header text-center bg-white border-0">
        <h3 class="mb-0">Login</h3>
      </div>
      <div class="card-body">
        {% if form.errors %}
          <div class="alert alert-danger text-center">
            Invalid username or password.
          </div>
        {% endif %}
        <form action="{% url 'login' %}" method="post" novalidate>
          {% csrf_token %}
          <div class="mb-3 text-start">
            {{ form.username.label_tag }}
            <input type="text" name="{{ form.username.name }}" id="{{ form.username.id_for_label }}"
                   class="form-control w-100" required>
          </div>
          <div class="mb-3 text-start">
            {{ form.password.label_tag }}
            <input type="password" name="{{ form.password.name }}" id="{{ form.password.id_for_label }}"
                   class="form-control w-100" required>
          </div>
          <input type="hidden" name="next" value="{{ next }}">
          <button type="submit" class="btn btn-primary w-100 mt-2">Login</button>
        </form>

        <div class="demo-login-panel mt-4">
          <div class="demo-login-title">Demo access</div>
          <div class="demo-login-grid">
            <button type="button"
                    class="demo-login-card"
                    data-demo-username="administrator1"
                    data-demo-password="Me262VoV">
              <span>Coordinator</span>
              <small>Full management access</small>
            </button>
            <button type="button"
                    class="demo-login-card"
                    data-demo-username="vol_tanya"
                    data-demo-password="GoodPass123!">
              <span>Volunteer</span>
              <small>Assigned tasks and reports</small>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  document.querySelectorAll("[data-demo-username]").forEach((button) => {
    button.addEventListener("click", () => {
      document.getElementById("{{ form.username.id_for_label }}").value = button.dataset.demoUsername;
      document.getElementById("{{ form.password.id_for_label }}").value = button.dataset.demoPassword;
    });
  });
</script>
{% endblock %}
