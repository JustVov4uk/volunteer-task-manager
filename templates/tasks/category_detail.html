{% extends "base.html" %}

{% block content %}
<div class="page-shell py-4">
  <div class="page-header">
    <div>
      <div class="eyebrow">Category details</div>
      <h1 class="page-title">{{ category.name }}</h1>
      <p class="page-subtitle">Work stream description and maintenance actions.</p>
    </div>

    <div class="d-flex gap-2">
      <a href="{% url 'tasks:category-list' %}" class="back-link">&larr; Back</a>
      {% if request.user.role == "coordinator" %}
        <a href="{% url 'tasks:category-update' pk=category.id %}" class="btn btn-primary">Update</a>
        <a href="{% url 'tasks:category-delete' pk=category.id %}" class="btn btn-outline-danger">Delete</a>
      {% endif %}
    </div>
  </div>

  <section class="form-section">
    <h2 class="form-section-title">Description</h2>
    <p class="mb-0 text-break">{{ category.description }}</p>
  </section>

</div>
{% endblock %}
