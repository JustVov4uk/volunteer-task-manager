{% extends "base.html" %}

{% block content %}
<div class="page-shell py-5">
  <section class="form-section confirm-card">
    <div class="eyebrow">Delete confirmation</div>
    <h1 class="page-title">Delete Report?</h1>
    <p class="page-subtitle">Are you sure you want to delete <strong>Report #{{ report.id }}</strong> ({{ report.task.title }})?</p>
    <form action="" method="post" class="form-actions justify-content-center">
      {% csrf_token %}
      <a href="{% url 'tasks:report-detail' pk=report.id %}" class="btn btn-outline-secondary">Cancel</a>
      <button type="submit" class="btn btn-danger">Yes, delete</button>
    </form>
  </section>
</div>
{% endblock %}
