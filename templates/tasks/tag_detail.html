{% extends "base.html" %}

{% block content %}
  <div class="page-shell py-4">
    <div class="page-header">
      <div>
        <div class="eyebrow">Tag details</div>
        <h1 class="page-title">{{ tag.name }}</h1>
        <p class="page-subtitle">Reusable label for grouping tasks.</p>
      </div>

      {% if request.user.role == "coordinator" %}
        <div class="d-flex gap-2">
          <a href="{% url 'tasks:tag-update' pk=tag.id %}" class="btn btn-primary">Update</a>
          <a href="{% url 'tasks:tag-delete' pk=tag.id %}" class="btn btn-outline-danger">Delete</a>
        </div>
      {% endif %}
    </div>

    <section class="form-section">
      <h2 class="form-section-title">Label</h2>
      <span class="tag-chip">{{ tag.name }}</span>
    </section>

    <div class="mt-3">
      <a href="{% url 'tasks:tag-list' %}" class="btn btn-outline-secondary">Back to list</a>
    </div>
  </div>
{% endblock %}
