{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block content %}
<div class="form-shell py-4">
  <div class="page-header">
    <div>
      <div class="eyebrow">Tag editor</div>
      <h1 class="page-title">{{ object|yesno:"Update Tag,Create Tag" }}</h1>
      <p class="page-subtitle">Create a short label for filtering and grouping tasks.</p>
    </div>
  </div>

  <form action="" method="post" novalidate>
    {% csrf_token %}
    {{ form.non_field_errors }}

    <section class="form-section">
      <h2 class="form-section-title">Tag Information</h2>
      {{ form|crispy }}
    </section>

    <div class="form-actions">
      <a href="{% url 'tasks:tag-list' %}" class="btn btn-outline-secondary">Cancel</a>
      <button type="submit" class="btn btn-primary">Save Tag</button>
    </div>
  </form>
</div>
{% endblock %}
